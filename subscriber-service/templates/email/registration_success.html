<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Our Service</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #f5f5f5; padding: 20px; }
        .content { padding: 20px; }
        .footer { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Our Service!</h1>
        </div>
        <div class="content">
            <p>Dear {{ content.name }},</p>
            <p>Your account has been successfully created with email: {{ content.email }}</p>
            <p>Start exploring our services by clicking the button below:</p>
            <p style="text-align: center;">
                <a href="https://dashboard.com/welcome" 
                   style="background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">
                    Get Started
                </a>
            </p>
        </div>
        <div class="footer">
            <p>If you have any questions, please contact our support team.</p>
        </div>
    </div>
</body>
</html>
